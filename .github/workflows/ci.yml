name: CI

# Path-filtered workflows can leave required checks pending. ci-docs.yml
# supplies static and test for documentation-only changes.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "modelos/**", "memory/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "modelos/**", "memory/**"]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.323

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run size
      - run: bun audit
      - run: bun run scripts/check-pr-rules-cli.ts
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  test:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      # Mutação só nos arquivos que o PR mudou: a suíte tem de ficar vermelha para cada mutante de scripts/mutants.ts.
      - run: bun run scripts/mutate-cli.ts --base ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
      # O mod roda no motor do Claude Code; o teste dele não precisa de login.
      - run: bunx --bun @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} plugin validate mod
      - run: bunx --bun @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} plugin test mod
